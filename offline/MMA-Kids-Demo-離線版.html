<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMA Kids 互動 Demo｜離線版</title>
<!-- 離線版：CSS 與 JS 都內嵌在這個檔案，雙擊即可用，不需要網路（字型改用電腦內建的微軟正黑體／蘋方） -->
<style>
/* MMA Kids 互動 Demo
   1440×900 舞台，依視窗等比縮放（投影、筆電、手機都能完整顯示） */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#EEF2F6}
body{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif;color:#1F2A37;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid #3A6EA5;outline-offset:2px}
svg{display:block}

:root{
  --green:#2F8F6B; --greenT:#21694F; --greenBg:#E6F4EE;
  --blue:#3A6EA5;  --blueBg:#E8F0F9;  --blueL:#A9C3E0;
  --pink:#C8454F;  --pinkBg:#FBEAEC;  --pinkL:#EBA7AD;
  --yellow:#B7791F;--yellowT:#7A4E0F; --yellowBg:#FDF3E1;
  --purple:#7B61A8;--purpleBg:#F1EDF8;
  --gray:#6B7280;  --grayBg:#F1F3F6;
  --ink:#1F2A37; --muted:#556070; --line:#E3E8EF; --paper:#F7F8FA;
}

.app{position:absolute;top:0;left:0;width:840px;height:820px;padding:24px 30px;gap:60px;background:#EEF2F6;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;transform-origin:0 0}

/* ---------- 左側章節列 ---------- */
.side{width:330px;flex:none;background:#fff;border-right:1px solid var(--line);padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.5px}
.brand-name{font-size:23px;font-weight:800}
.slogan{font-size:13px;color:var(--muted);line-height:1.6}
.chaps{display:flex;flex-direction:column;gap:2px}
.chap{border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:10px;text-align:left;width:100%;min-height:36px;font-size:14px;font-weight:600}
.chap:hover{background:var(--grayBg)}
.chap.on{background:var(--ink);color:#fff}
.chap .num{font-size:12px;font-weight:700;color:var(--muted);width:20px}
.chap.on .num{color:#F3C46B}
.badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--blueBg);color:#2B5584;white-space:nowrap}
.badge.duo{background:var(--yellowBg);color:var(--yellowT)}
.tipbox{background:var(--paper);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tipbox .t{font-size:12px;font-weight:700}
.tipbox .b{font-size:13px;line-height:1.65;color:#344054}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

/* ---------- 主舞台 ---------- */
.main{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 24px;gap:10px;min-width:0}
.mhead{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1000px;gap:12px}
.mtitle{display:flex;align-items:center;gap:10px}
.mtitle .t{font-size:20px;font-weight:800}
.navbtn{border:1px solid #CDD5E0;background:#fff;border-radius:12px;min-height:40px;padding:0 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;color:#344054}
.navbtn:disabled{opacity:.35;cursor:default}
.navbtn .ico{width:16px;height:16px}
.mode{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.mode.solo{background:var(--blueBg);color:#2B5584}
.mode.duo{background:var(--yellowBg);color:var(--yellowT)}
.stagerow{display:flex;gap:24px;align-items:flex-start}
.rightcol{display:flex;flex-direction:column;gap:14px;margin-top:30px;width:290px}
.phonecol{display:flex;flex-direction:column;gap:8px}
.lbl-phone{font-size:13px;font-weight:700;color:var(--muted);text-align:center}

/* ---------- 示範控制台（非產品畫面） ---------- */
.console{width:230px;margin-top:30px;border:2px dashed #9AA6B8;background:#E9EDF2;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rightcol .console{margin-top:0;width:100%}
.chd0{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.5px;padding-bottom:6px;border-bottom:1px dashed #AEB8C6}
.chd{font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}
.cbtn{border:1px solid #AEB8C6;background:#fff;border-radius:10px;min-height:40px;padding:6px 12px;font-size:13px;font-weight:700;color:#344054;display:flex;align-items:center;gap:8px;text-align:left;width:100%}
.cbtn:hover{background:#F8FAFC}
.cbtn:disabled{opacity:.45;cursor:default}
.cchips{display:flex;gap:6px}
.cchip{flex:1;border:1px solid #AEB8C6;background:#fff;border-radius:10px;min-height:40px;font-size:13px;font-weight:700;color:#344054}
.cchip.on{background:var(--muted);border-color:var(--muted);color:#fff}
.cempty{font-size:12px;color:var(--muted);line-height:1.6}

/* ---------- 單手機時的家長端同步面板 ---------- */
.sync{width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.sync .hd{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.sync .it{font-size:13px;line-height:1.5;padding:8px 10px;background:var(--paper);border-radius:10px;animation:pop .35s ease}
.sync .empty{font-size:13px;color:var(--muted);line-height:1.6}

/* ---------- 終章 ---------- */
.summary{margin-top:30px;width:100%;max-width:1000px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:44px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.summary .sk{font-size:14px;font-weight:700;color:var(--greenT);letter-spacing:2px}
.summary .stt{font-size:30px;font-weight:800;line-height:1.4}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:100%;margin-top:16px}
.sumcol{border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.sumcol .st{font-size:20px;font-weight:800}
.sumcol .sd{font-size:15px;line-height:1.7;color:#344054}
.summary .sfoot{margin-top:14px;font-size:14px;color:var(--muted);line-height:1.7}

/* ---------- 手機 ---------- */
.ph{width:360px;height:740px;border-radius:46px;background:#1F2A37;padding:10px;box-shadow:0 24px 48px rgba(31,42,55,.18);flex:none}
.scr{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--paper);position:relative;display:flex;flex-direction:column}
.top{padding:22px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.top .app-n{font-size:11px;font-weight:700;color:var(--greenT);letter-spacing:.5px}
.top .app-n.p{color:var(--muted)}
.top .ttl{font-size:19px;font-weight:800}
.body{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.avatar{width:36px;height:36px;border-radius:50%;background:#F3C46B;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.avatar.p{background:var(--blueBg);color:#2B5584}
.iconbtn{background:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);flex:none}

.card{background:#fff;border-radius:18px;padding:14px 16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
button.card{cursor:pointer}
.card.c-green{background:var(--greenBg);border-color:#BFE3D3}
.card.c-blue{background:var(--blueBg);border-color:#C8D9EC}
.card.c-pink{background:var(--pinkBg);border-color:#F1C7CB}
.card.c-yellow{background:var(--yellowBg);border-color:#F0D6A8}
.card.c-purple{background:var(--purpleBg);border-color:#D9CFEA}
.card.c-gray{background:var(--grayBg);border-color:#DDE1E7}
.center{align-items:center;text-align:center}
.h3{font-size:15px;font-weight:700;margin:0}
.sm{font-size:13px;color:var(--muted)}
.xs{font-size:11px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.sb{justify-content:space-between}
.col{display:flex;flex-direction:column}
.big{font-size:38px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.mid{font-size:26px;font-weight:800}
.t-green{color:var(--greenT)}.t-blue{color:var(--blue)}.t-pink{color:var(--pink)}.t-yellow{color:var(--yellowT)}.t-purple{color:var(--purple)}.t-gray{color:var(--gray)}

.track{height:10px;border-radius:99px;background:#E3E8EF;overflow:hidden;width:100%;display:flex}
.track.thin{height:7px}
.seg{height:100%;transition:width .4s}
.seg.blue{background:var(--blue)}.seg.blueL{background:var(--blueL)}
.seg.pink{background:var(--pink)}.seg.pinkL{background:var(--pinkL)}
.seg.gray{background:#AEB4BE}.seg.green{background:var(--green)}

.legend{display:flex;flex-direction:column;gap:6px}
.legend .lr{border:0;padding:4px 0}
.dotc{width:10px;height:10px;border-radius:50%;flex:none}

.jars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.jar{border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border:1px solid var(--line);background:#fff}
.jar .jn{font-size:12px;font-weight:700}
.jar .jp{font-size:16px;font-weight:800}
.jar .jd{font-size:10px;color:var(--muted);line-height:1.4}
.jar.save{background:var(--blueBg);border-color:#C8D9EC}
.jar.need{background:var(--greenBg);border-color:#BFE3D3}
.jar.want{background:var(--yellowBg);border-color:#F0D6A8}

/* 三罐子比例調整（初次設定、錢包設定共用） */
.jrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#fff}
.jrow.save{background:var(--blueBg);border-color:#C8D9EC}
.jrow.need{background:var(--greenBg);border-color:#BFE3D3}
.jrow.want{background:var(--yellowBg);border-color:#F0D6A8}
.jrow .jt{font-size:15px;font-weight:800}
.jrow .jamt{font-size:12px;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px;margin-left:auto}
.step .pc{width:46px;text-align:center;font-size:17px;font-weight:800}
.sbtn2{width:34px;height:34px;border-radius:10px;border:1px solid #CDD5E0;background:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#344054}
.sbtn2:disabled{opacity:.35;cursor:default}
.total{font-size:13px;font-weight:700;border-radius:10px;padding:8px 12px;text-align:center}
.total.ok{background:var(--greenBg);color:var(--greenT)}
.total.no{background:#FFF1DB;color:#5A3300}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.lbl-row{display:flex;align-items:center;justify-content:center;gap:8px}
.minibtn{border:1px solid #CDD5E0;background:#fff;border-radius:99px;padding:0 10px;line-height:17px;font-size:11px;font-weight:700;color:var(--muted)}

.safety{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sbtn{border:1px solid #D3D8DF;background:var(--grayBg);color:#3F4753;border-radius:14px;min-height:46px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.sbtn .ico{width:17px;height:17px}
.seeline{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.seeline .ico{width:14px;height:14px}
.banner{display:flex;align-items:center;gap:8px;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.5}
.banner.warn{background:#FFF1DB;border:1px solid #F0B75A;color:#5A3300}
.banner.info{background:var(--blueBg);border:1px solid #C8D9EC;color:#234B75}
.banner.gray{background:var(--grayBg);border:1px solid #D3D8DF;color:#3F4753}

.btn{border:0;border-radius:14px;min-height:46px;padding:0 16px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.b-green{background:var(--green);color:#fff}
.b-blue{background:var(--blue);color:#fff}
.b-pink{background:var(--pink);color:#fff}
.b-yellow{background:#E9A93A;color:#2A1A02}
.b-purple{background:var(--purple);color:#fff}
.b-gray{background:var(--grayBg);color:#3F4753;border:1px solid #D3D8DF}
.b-line{background:#fff;color:#344054;border:1px solid #CDD5E0}
.b-dash{background:#fff;color:var(--yellowT);border:2px dashed #E3B86A}
.ghost{background:transparent;color:var(--muted);min-height:40px;justify-content:flex-start;padding:0;width:auto;border:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}
.link{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;text-decoration:underline;padding:6px 0;align-self:center}

.tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding:4px 4px 12px;flex:none}
.tab{flex:1;border:0;background:none;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center}
.tab.on{color:var(--greenT);font-weight:800}
.tabs.p .tab.on{color:#2B5584}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.tag.need{background:var(--blueBg);color:#2B5584}
.tag.want{background:var(--yellowBg);color:var(--yellowT)}
.tag.none{background:var(--grayBg);color:var(--muted)}
.tag.ok{background:var(--greenBg);color:var(--greenT)}
.tag.task{background:var(--yellowBg);color:var(--yellowT)}
.tag.wait{background:var(--blueBg);color:#2B5584}
.tag.got{background:#E9A93A;color:#2A1A02}
.src{font-size:10px;font-weight:700;border-radius:6px;padding:1px 5px;background:var(--greenBg);color:var(--greenT)}
.src.m{background:var(--grayBg);color:var(--muted)}

.lr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #EEF1F5;font-size:14px}
.lr:last-child{border-bottom:0}
.lrbtn{border:0;border-bottom:1px solid #EEF1F5;background:none;width:100%;text-align:left;font-size:14px}
.items{background:var(--paper);border-radius:10px;padding:8px 12px;margin:2px 0 6px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.grouphd{font-size:11px;font-weight:700;color:var(--muted);background:var(--grayBg);border-radius:8px;padding:3px 10px;margin-top:4px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:52px;text-align:left;width:100%}
.opt{border:1px solid #CDD5E0;background:#fff;border-radius:12px;min-height:46px;padding:8px 12px;text-align:left;font-size:14px;width:100%;display:flex;align-items:center;gap:8px}
.opt .k{width:24px;height:24px;border-radius:50%;background:var(--grayBg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.opt.right{background:var(--greenBg);border-color:var(--green)}
.opt.wrong{background:#FFF1DB;border-color:#F0B75A}
.fb{font-size:13px;line-height:1.6;border-radius:12px;padding:10px 12px}
.fb.ok{background:var(--greenBg);color:var(--greenT)}
.fb.no{background:#FFF1DB;color:#5A3300}
.chip{border:1px solid #CDD5E0;background:#fff;border-radius:99px;padding:0 14px;min-height:38px;font-size:13px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.chip.s{min-height:32px;padding:0 12px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg3 .chip{padding:0 4px}
.sw{width:48px;height:28px;border-radius:99px;background:#AEB4BE;border:0;position:relative;flex:none}
.sw.on{background:var(--green)}
.sw.fixed{background:var(--green);cursor:default;opacity:.75}
.knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on .knob,.sw.fixed .knob{left:23px}
.check{width:22px;height:22px;border-radius:6px;border:2px solid #AEB4BE;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.check .ico{width:14px;height:14px;stroke-width:3}
.ckrow{border:0;background:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:14px;padding:6px 0;min-height:40px}

.paycard{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;border:2px solid var(--line);background:#fff}
.paycard.a{background:var(--grayBg);border-color:#DDE1E7}
.paycard.b{border-color:var(--blue);background:#fff}
.paycard .big2{font-size:18px;font-weight:800}

.taskcard{background:#fff;border:1px solid #F0D6A8;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.taskcard.got{background:var(--yellowBg)}
.giftline{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--yellowT)}
.giftline .ico{width:17px;height:17px}
.pdots{display:flex;gap:4px}
.pdots span{width:12px;height:12px;border-radius:50%;background:#F0D6A8}
.pdots span.on{background:#E9A93A}
.need-box{display:flex;flex-direction:column;gap:8px}
.todo{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:2px solid var(--line);background:#fff;animation:pop .35s ease}
.todo.red{border-color:#E08A92;background:#FDF1F2}
.todo.blue{border-color:#A9C3E0}
.todo.yellow{border-color:#E3B86A}
.todo .ttl2{font-size:14px;font-weight:800}
.stat3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.statbox{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.statbox b{font-size:17px;font-weight:800}
.lesson{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:52px;width:100%;text-align:left}
.lesson .li{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--greenBg);color:var(--greenT)}
.lesson .li .ico{width:16px;height:16px}
.thumb{height:150px;flex:none;border-radius:14px;background:linear-gradient(135deg,#2F8F6B,#3A6EA5);display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.thumb .playc{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.thumb .cap{position:absolute;left:12px;bottom:10px;font-size:12px;font-weight:700}
.qbar{height:6px;border-radius:99px;background:#E3E8EF;overflow:hidden}
.qbar div{height:100%;background:var(--green)}
.msg{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:13px;line-height:1.6;align-self:flex-start;max-width:92%}
.textarea{width:100%;min-height:90px;border:1px solid #CDD5E0;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;resize:none;background:#fff}
.hotline{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:14px;padding:10px 16px;width:100%}
.hotline .ico{width:26px;height:26px;color:#2B5584}
.trustbig{background:var(--purple);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px}
.qr{display:flex;flex-direction:column;align-items:center;gap:8px}

/* 疊層 */
.overlay{position:absolute;inset:0;background:rgba(31,42,55,.5);display:flex;align-items:flex-end;z-index:5}
.overlay.mid{align-items:center;justify-content:center;padding:18px}
.sheet{background:#fff;width:100%;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px;display:flex;flex-direction:column;gap:10px;animation:up .3s ease;scrollbar-width:none}
.pop{background:#fff;border-radius:24px;padding:24px 20px 20px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;width:100%;animation:pop .45s ease}
.pop.left{align-items:stretch;text-align:left}
.ring{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring .ico{width:40px;height:40px}
.ring.blue{background:var(--blue);color:#fff}
.ring.yellow{background:#E9A93A;color:#2A1A02}
.ring.gray{background:var(--gray);color:#fff}
.ring.green{background:var(--greenBg);color:var(--greenT)}
.toast{position:absolute;top:14px;left:12px;right:12px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;z-index:7;display:flex;gap:10px;align-items:center;box-shadow:0 10px 24px rgba(0,0,0,.22);animation:down .3s ease}
.toast .ico{color:#F3C46B}

@keyframes pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes up{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes down{0%{transform:translateY(-16px);opacity:0}100%{transform:translateY(0);opacity:1}}
.fade{animation:pop .35s ease}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* 首頁大圓餅：我的錢怎麼分／這週花在哪 */
.piecard{align-items:center;gap:12px;padding:14px 14px 12px}
.pietabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--grayBg);border-radius:12px;padding:3px;width:100%}
.pietabs button{border:0;background:none;border-radius:10px;min-height:34px;font-size:13px;font-weight:700;color:var(--muted)}
.pietabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(31,42,55,.12)}
.pie{width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;transition:background .4s}
.pie .hole{width:112px;height:112px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pie .hole b{font-size:24px;font-weight:800}
.pleg{display:flex;align-items:center;gap:10px;border:0;background:var(--paper);border-radius:12px;padding:8px 12px;width:100%;text-align:left}
button.pleg:hover{background:var(--grayBg)}
.pl-t{font-size:15px;font-weight:800}
.pl-p{font-size:13px;font-weight:700;color:var(--muted)}
.pl-a{font-size:16px;font-weight:800}
.pietip{display:flex;gap:8px;align-items:flex-start;background:var(--yellowBg);color:var(--yellowT);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700;line-height:1.55;width:100%}
.pietip .ico{width:16px;height:16px;margin-top:2px}

/* 付款碼頁：可疑詐騙按鈕 */
.suspbtn{background:#FFF1DB;color:#8A4B00;border:1px solid #F0B75A}

/* 18 歲升級 DAWHO 步驟列 */
.dsteps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:2px}
.dsteps div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--muted);text-align:center}
.dsteps span{width:24px;height:24px;border-radius:50%;background:var(--grayBg);border:1px solid #D3D8DF;display:flex;align-items:center;justify-content:center;font-size:12px}
.dsteps .on{color:var(--ink)}
.dsteps .on span{background:var(--ink);border-color:var(--ink);color:#fff}
.dsteps .done span{background:var(--green);border-color:var(--green);color:#fff}

/* 防亂花錢設定：自訂金額輸入 */
.limin{flex:1;display:flex;align-items:center;gap:4px;border:1px solid #CDD5E0;border-radius:10px;background:#fff;padding:0 10px;min-height:38px;font-weight:700;min-width:0}
.limin input{border:0;outline:0;width:100%;min-width:0;font-size:14px;font-weight:700;background:transparent;font-family:inherit}
.limin:focus-within{outline:3px solid #3A6EA5;outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 示範選單（非產品畫面，取代原本的示範控制台） */
.phonecol{position:relative}
.minibtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.demomenu{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:280px;max-height:640px;overflow-y:auto;z-index:20;border:2px dashed #9AA6B8;background:#E9EDF2;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:5px;box-shadow:0 14px 30px rgba(31,42,55,.22);scrollbar-width:none}
.dm-t{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.5px;padding-bottom:5px;border-bottom:1px dashed #AEB8C6}
.dm-h{font-size:11px;font-weight:700;color:var(--muted);margin-top:4px}
.dm-i{border:1px solid #AEB8C6;background:#fff;border-radius:10px;min-height:36px;padding:5px 10px;font-size:13px;font-weight:700;color:#344054;display:flex;align-items:center;gap:8px;text-align:left;width:100%}
.dm-i:hover{background:#F8FAFC}
.dm-i:disabled{opacity:.45;cursor:default}
/* 轉帳日：一週七天排成一列 */
.chips.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.chips.days .chip{padding:0}
.limin input[type=time]{font-size:14px}

</style>

// 依零用錢與三罐子比例，算出每次入帳分到各罐的金額
function portions(s = state) {
  const a = s.allowance.amount, save = Math.round(a * s.jars[0] / 100), need = Math.round(a * s.jars[1] / 100);
  return {save, need, want:a - save - need};
}
// 示範起點：本週一的零用錢已依設定入帳，需要罐已花掉早餐＋公車
function fillWeek(s) {
  const p = portions(s);
  s.need = Math.max(0, p.need - WEEK_NEED_SPENT); s.want = p.want;
  const t = s.tx.find(x => x.id === 3); if (t) t.amt = s.allowance.amount;
}

// ================= 計算 =================
function heldAll() { return state.match.heldTotal + state.match.heldThisWeek; }
const bal = () => state.need + state.want;   // 可以用的錢＝需要罐＋想要罐
// 從指定罐子扣錢；不夠時從另一個罐子補（呼叫前需確認兩罐合計足夠）
function take(amt, first = 'want') {
  const s = state, other = first === 'want' ? 'need' : 'want';
  const a = Math.min(s[first], amt);
  s[first] -= a; s[other] = Math.max(0, s[other] - (amt - a));
}
function pct(saved, held) { return Math.min(100, Math.round((saved + held) / state.goal.target * 100)); }
// 依家長設定計算這筆存款可以配對多少（孩子端不顯示公式）
function matchFor(amount, srcKey) {
  const m = state.match;
  if (m.paused || !srcKey || !m.sources[srcKey]) return 0;
  return Math.max(0, Math.floor(Math.min(amount * m.ratio, m.weekCap - m.heldThisWeek, m.goalCap - heldAll())));
}
function derive() {
  const s = state, held = heldAll();
  const progress = pct(s.goal.saved, held);
  const remain = Math.max(0, s.goal.target - s.goal.saved - held);
  const perWeek = (s.allowance.on && !s.allowance.paused ? portions().save : 0) + (s.match.paused ? 0 : s.match.weekCap);
  const spends = s.tx.filter(t => !t.income);
  const need = spends.filter(t => t.tag === 'need').reduce((a, t) => a + t.amt, 0);
  const want = spends.filter(t => t.tag === 'want').reduce((a, t) => a + t.amt, 0);
  const tagged = need + want;
  const weekTx = s.tx.filter(isWeek);
  return {
    held, progress, remain, perWeek,
    eta: remain === 0 ? '已達成！' : perWeek ? `照現在的速度，約 ${Math.ceil(remain / perWeek)} 週後達成` : '持續存錢，就會越來越近',
    needPct: tagged ? Math.round(need / tagged * 100) : 0,
    untagged: spends.filter(t => !t.tag).length,
    weekIn: weekTx.filter(t => t.income).reduce((a, t) => a + t.amt, 0),
    weekOut: weekTx.filter(t => !t.income).reduce((a, t) => a + t.amt, 0),
    pending: s.approvals.filter(a => a.status === 'pending')
  };
}

// ---------- 首頁大圓餅：我的錢怎麼分／這週花在哪 ----------
const PIE_COLOR = {save:'var(--blue)', need:'var(--green)', want:'#E9A93A', none:'#C9CFD8'};
function pieBg(parts) {   // parts: [[key, value]]，回傳 conic-gradient
  const total = parts.reduce((a, [, v]) => a + v, 0);
  if (!total) return '#E3E8EF';
  let acc = 0;
  return `conic-gradient(${parts.filter(([, v]) => v > 0).map(([k, v]) => { const a = acc; acc += v / total * 360; return `${PIE_COLOR[k]} ${a.toFixed(1)}deg ${acc.toFixed(1)}deg`; }).join(',')})`;
}
function moneyPie() {
  const s = state, mode = s.homePie, p = portions();
  const tabs = `<div class="pietabs">${[['plan', '我的錢怎麼分'], ['spent', '這週花在哪']].map(([k, l]) => `<button class="${mode === k ? 'on' : ''}" data-act="homePie" data-arg="${k}">${l}</button>`).join('')}</div>`;
  if (mode === 'plan') {
    const leg = (k, i, amt, sub, act) => `<button class="pleg" data-act="${act[0]}" data-arg="${act[1]}">
        <span class="dotc" style="background:${PIE_COLOR[k]};width:14px;height:14px"></span>
        <span class="col" style="flex:1"><span class="pl-t">${JAR_INFO[k].t} <span class="pl-p">${s.jars[i]}%</span></span><span class="xs">${sub}</span></span>
        <b class="pl-a">$${fmt(amt)}</b></button>`;
    return `<div class="card piecard">${tabs}
      <div class="pie" style="background:${pieBg([['save', s.jars[0]], ['need', s.jars[1]], ['want', s.jars[2]]])}">
        <div class="hole"><span class="xs">每週零用錢</span><b>$${fmt(s.allowance.amount)}</b></div></div>
      <div class="col" style="gap:4px;width:100%">
        ${leg('save', 0, s.goal.saved, `每週存 $${fmt(p.save)}・存進${s.goal.name}`, ['kv', 'dream'])}
        ${leg('need', 1, s.need, `罐裡還剩・${JAR_INFO.need.d}`, ['openJars', ''])}
        ${leg('want', 2, s.want, `罐裡還剩・${JAR_INFO.want.d}`, ['openJars', ''])}</div>
      <div class="pietip">${ic('star')}<span>每拿到 $100，有 $${s.jars[0]} 先存進夢想。${s.jars[0] >= 30 ? '先存再花，很棒！' : '多存一點，夢想更快達成！'}</span></div>
      <button class="link" style="padding:0" data-act="openJars">調整三罐子比例</button></div>`;
  }
  // 這週花在哪：依小安標記的需要／想要（未標記另外算）
  const wk = s.tx.filter(t => !t.income && isWeek(t));
  const sum = tag => wk.filter(t => (t.tag || 'none') === tag).reduce((a, t) => a + t.amt, 0);
  const need = sum('need'), want = sum('want'), none = sum('none'), total = need + want + none;
  const pc = v => total ? Math.round(v / total * 100) : 0;
  const tip = !total ? '這週還沒花錢，繼續保持！'
    : none ? `還有 $${fmt(none)} 沒標記，到錢包點一下就能補標。`
    : want > need ? '這週「想要」花得比「需要」多，下次買之前先想一想：沒有它會怎樣？'
    : '做得好！大部分的錢都花在「需要」的東西上。';
  const row = (k, lbl, v) => `<div class="pleg static"><span class="dotc" style="background:${PIE_COLOR[k]};width:14px;height:14px"></span>
      <span class="pl-t" style="flex:1">${lbl} <span class="pl-p">${pc(v)}%</span></span><b class="pl-a">$${fmt(v)}</b></div>`;
  return `<div class="card piecard">${tabs}
    <div class="pie" style="background:${pieBg([['need', need], ['want', want], ['none', none]])}">
      <div class="hole"><span class="xs">這週花了</span><b>$${fmt(total)}</b></div></div>
    <div class="col" style="gap:4px;width:100%">${row('need', '需要', need)}${row('want', '想要', want)}${none ? row('none', '還沒標記', none) : ''}</div>
    <div class="pietip">${ic('star')}<span>${tip}</span></div></div>`;
}

function progText(t) {
  if (!t.prog) return t.status === 'waiting' ? '已回報' : '';
  return t.prog.type === 'quiz' ? `答對 ${t.prog.done} / ${t.prog.total} 題` : `第 ${t.prog.done}/${t.prog.total} 天`;
}

// ---------- 三罐子比例調整（初次設定與錢包共用） ----------
function jarEditor(dr) {
  const a = state.allowance.on ? state.allowance.amount : 0, sum = dr[0] + dr[1] + dr[2];
  const save = Math.round(a * dr[0] / 100), need = Math.round(a * dr[1] / 100), amts = [save, need, a - save - need];
  const row = (k, i) => `<div class="jrow ${k}">
      <span class="col"><span class="jt ${k === 'save' ? 't-blue' : k === 'need' ? 't-green' : 't-yellow'}">${JAR_INFO[k].t}</span>
        <span class="jamt">${a && sum === 100 ? `每週 $${fmt(amts[i])}・` : ''}${JAR_INFO[k].d}</span></span>
      <span class="step"><button class="sbtn2" aria-label="${JAR_INFO[k].t}減少" data-act="jarStep" data-arg="${i}|-5" ${dr[i] <= 0 ? 'disabled' : ''}>−</button>
        <span class="pc">${dr[i]}%</span>
        <button class="sbtn2" aria-label="${JAR_INFO[k].t}增加" data-act="jarStep" data-arg="${i}|5" ${dr[i] >= 100 ? 'disabled' : ''}>+</button></span></div>`;
  return `<div class="chips">${JAR_PRESETS.map((p, i) => `<button class="chip s ${String(dr) === String(p) ? 'on' : ''}" data-act="jarPreset" data-arg="${i}">${p.join('／')}</button>`).join('')}</div>
    <div class="col" style="gap:6px">${['save', 'need', 'want'].map(row).join('')}</div>

}

      <div class="row sb"><span class="h3" style="font-size:18px">存一筆進${s.goal.name}</span><button class="iconbtn" aria-label="關閉" data-act="closeDeposit">${ic('x')}</button></div>

function kidScene() {
  const sc = state.scene;
  if (sc.type === 'drill') {
    const x = drillOf(sc.id);
    if (sc.step === 0) {
      const ok = `<button class="btn b-line" data-act="drillPick" data-arg="ok">${x.ok}</button>`;
      const bad = `<button class="btn b-line" data-act="drillPick" data-arg="bad">${x.bad}</button>`;
      return `<div class="overlay mid"><div class="pop left">
        <div class="row sb"><span class="tag task">情境演練・${x.tag}</span><button class="iconbtn" aria-label="離開演練" data-act="drillExit">${ic('x')}</button></div>
        <span class="xs" style="font-weight:700">${x.from}</span>
        <div class="msg">${x.msg}</div>
        <span class="h3">你會怎麼做？</span>
        ${x.badFirst ? bad + ok : ok + bad}</div></div>`;
    }
    const good = sc.step === 'ok';
    return `<div class="overlay mid"><div class="pop left">

    if (sc.step === 0) return `<div class="overlay mid"><div class="pop left">
      <span class="xs" style="font-weight:700">網友傳來訊息</span>

      <div class="row">${ic('shieldAlert', 'width:26px;height:26px;color:#8A4B00')}<span class="h3" style="font-size:17px">這筆錢還沒入帳，不能轉出</span></div>
      <span style="font-size:14px;line-height:1.7">有人轉錢給你又要你轉出去，這是常見的人頭帳戶詐騙。媽媽也已經收到通知。</span>
      <button class="btn b-green" data-act="sceneHelp">遇到可疑的事</button>
      <button class="btn b-line" data-act="closeScene">我知道了</button></div></div>`;
  }
  return `<div class="overlay mid"><div class="pop left">
    <span class="xs" style="font-weight:700">你在二手平台賣演唱會周邊，買家說：</span>
    <div class="msg">我付款失敗了，請你操作網銀驗證帳戶，再補轉 $300 給我。</div>
    <div class="banner warn">${ic('shieldAlert')}<span>轉帳前提醒：真正的買家不會要你操作網銀，這是假買家詐騙。</span></div>
    <span class="xs">已同步通知媽媽</span>
    <button class="btn b-green" data-act="closeScene">取消轉帳</button>
    <button class="btn b-line" data-act="fakeContinue">我確定要繼續</button></div></div>`;
}

function todoList(d) {
  const s = state, out = [];
  const two = (b1, b2) => `<div class="grid2" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">${b1}${b2}</div>`;
  const sbtn = (cls, act, arg, label) => `<button class="btn ${cls}" style="min-height:40px;font-size:13px" data-act="${act}" data-arg="${arg}">${label}</button>`;
  if (s.cardFrozen) out.push(`<div class="todo blue"><span class="ttl2">${ic('lock', 'width:16px;height:16px;display:inline;vertical-align:-3px')} 小安的卡片暫停中</span>
    <span class="sm" style="line-height:1.6">已通報永豐並補發新卡（約 7 個工作天）。手機付款碼照常可用。</span>
    ${sbtn('b-line', 'cardRestore', '', '新卡已收到，恢復使用')}</div>`);
  s.alerts.forEach(a => out.push(`<div class="todo red"><span class="ttl2" style="color:#8E2A33">${ic('shieldAlert', 'width:16px;height:16px;display:inline;vertical-align:-3px')} ${a.title}</span><span class="sm" style="line-height:1.6;color:#3F4753">${a.text}</span>
    ${a.kind === 'card' ? `${two(sbtn('b-line', 'cardMine', a.id, '是小安本人刷的'), sbtn('b-pink', 'cardNotMine', a.id, '不是，停卡通報'))}
        <span class="xs">這筆已被擋下，沒有扣款。停卡後會補發新卡，手機付款碼照常可用。</span>`
    : a.kind === 'susp' ? `${two(sbtn('b-pink', 'callKid', '', '打電話給小安'), sbtn('b-line', 'suspReport', a.id, '通報永豐客服'))}
        ${s.payLocked ? `<button class="link" style="align-self:flex-start;padding:0" data-act="suspSafe" data-arg="${a.id}">確認安全，解除付款碼鎖定</button>` : ''}`
    : a.kind === 'help' ? `<div class="grid2" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px"><button class="btn b-pink" style="min-height:40px;font-size:13px" data-act="callKid">打電話給小安</button><button class="btn b-line" style="min-height:40px;font-size:13px" data-act="ackAlert" data-arg="${a.id}">聯繫永豐客服</button></div>${s.frozen ? '<button class="link" style="align-self:flex-start;padding:0" data-act="unfreeze">解除轉帳暫停</button>' : ''}`
      : `<button class="btn b-line" style="min-height:40px;font-size:13px" data-act="ackAlert" data-arg="${a.id}">我知道了</button>`}</div>`));
  if (s.heldIncoming) out.push(`<div class="todo blue"><span class="ttl2">陌生帳戶轉入 $${fmt(s.heldIncoming.amt)}，已先保留</span><span class="sm">對方不在家人名單內。確認是認識的人才會入帳。</span>
    <div class="grid2" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px"><button class="btn b-line" style="min-height:40px;font-size:13px" data-act="heldOk">確認是認識的人</button><button class="btn b-pink" style="min-height:40px;font-size:13px" data-act="heldReturn">退回並通報</button></div></div>`);
  d.pending.forEach(a => out.push(`<div class="todo blue"><span class="ttl2">${a.title}</span>${a.reason ? `<span class="sm">小安：「${a.reason}」</span>` : ''}<span class="xs">24 小時未回覆會自動取消</span>
    <div class="grid2" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px"><button class="btn b-green" style="min-height:40px;font-size:13px" data-act="approveYes" data-arg="${a.id}">同意</button><button class="btn b-line" style="min-height:40px;font-size:13px" data-act="approveNo" data-arg="${a.id}">不同意</button></div></div>`));
  s.tasks.filter(t => t.status === 'waiting').forEach(t => out.push(`<div class="todo yellow"><div class="row sb"><span class="ttl2">${t.t}：小安已回報</span><button class="btn b-yellow" style="min-height:36px;font-size:13px;width:auto" data-act="openReport" data-arg="${t.id}">查看</button></div></div>`));
  return out;
}

function spendBlock() {
  const s = state, spends = s.tx.filter(t => !t.income);
  if (s.viewLevel === 'monthly') {
    const cat = {}; spends.forEach(t => { cat[t.cat] = (cat[t.cat] || 0) + t.amt; });
    return `<div class="card" style="gap:0"><div class="row sb"><span class="h3">本月分類總額</span><span class="xs">每月分類總額</span></div>
      ${Object.entries(cat).map(([k, v]) => `<div class="lr"><span>${k}</span><b>$${fmt(v)}</b></div>`).join('')}
      <span class="xs" style="margin-top:6px">單筆消費不顯示；有異常時才通知</span></div>`;
  }
  return `<div class="card" style="gap:0"><div class="row sb"><span class="h3">最近消費</span><span class="xs">${LEVELS[s.viewLevel].t}</span></div>
    ${spends.slice(0, 4).map(t => `<div class="lr"><span class="col"><span>${t.store}</span>${s.viewLevel === 'detail' && t.items ? `<span class="xs">${itemsText(t.items)}</span>` : `<span class="xs">${t.when}</span>`}</span>
      <span class="row">${s.viewLevel === 'detail' ? tagHtml(t) : ''}<b>-$${fmt(t.amt)}</b></span></div>`).join('')}</div>`;
}

function parTask() {

function parReport() {
  const s = state, t = taskOf(s.reportOf); if (!t) return '';

  const ref = t.id === 'antiScam' ? `已看完影片、答對 ${t.prog ? t.prog.done : 3}/3 題` : t.prog ? progText(t) : '';
  return `
    <span class="sm">${t.t} → ${g.t}</span>

}

  time:        {kind:'time',                                name:'轉帳時間',   get:() => state.allowance.time,   set:v => { state.allowance.time = v; }},
  ratio:       {kind:'ratio', lo:0.1, hi:5,     step:0.1, name:'配對比例',   get:() => state.match.ratio,      set:v => { state.match.ratio = v; }},
  weekCap:     {kind:'money', lo:10,  hi:2000,  step:10,  name:'每週配對上限', get:() => state.match.weekCap,  set:v => { state.match.weekCap = v; }},
  goalCap:     {kind:'money', lo:50,  hi:20000, step:50,  name:'這個夢想的配對上限', get:() => state.match.goalCap, set:v => { state.match.goalCap = v; }},
  monthBudget: {kind:'money', lo:100, hi:50000, step:100, name:'每月上限',   get:() => state.monthBudget,      set:v => { state.monthBudget = v; }, tell:true},

};
const fieldLabel = (f, v) => f.kind === 'money' ? `$${fmt(v)}` : f.kind === 'ratio' ? `1:${v}` : v;
function optChips(key, opts, small = true) {
  const s = state, f = FIELDS[key], cur = f.get(), e = s.limitEdit, editing = e && e.key === key;
  const custom = !opts.includes(cur), cls = `chip${small ? ' s' : ''}`;
  const range = f.kind === 'time' ? '輸入 00:00～23:59' : `可設定 ${fieldLabel(f, f.lo)}～${fieldLabel(f, f.hi)}`;
  const input = f.kind === 'time'
    ? `<input id="limit-input" type="time" value="${esc(e && editing ? e.val : '')}">`
    : `<input id="limit-input" type="number" inputmode="decimal" min="${f.lo}" max="${f.hi}" step="${f.step}" value="${esc(e && editing ? e.val : '')}" placeholder="${f.kind === 'ratio' ? '例如 1.5' : '輸入金額'}">`;
  return `<div class="chips">${opts.map(v => `<button class="${cls} ${cur === v && !editing ? 'on' : ''}" data-act="pickField" data-arg="${key}|${v}">${fieldLabel(f, v)}</button>`).join('')}
      <button class="${cls} ${custom || editing ? 'on' : ''}" data-act="limitCustom" data-arg="${key}">${custom && !editing ? `自訂 ${fieldLabel(f, cur)}` : '自訂'}</button></div>

        <label class="sr" for="limit-input">自訂${f.name}</label>

// ================= 動作 =================
function goCh(id) {
  const c = chOf(id);
  const patch = {ch:id, pay:null, deposit:null, lesson:null, quizPick:null, scamQuiz:null, scene:null, check:null, help:null, doneSheet:null, approvalReq:null, pauseSheet:null, giftList:false, openTx:null};
  if (!c.summary) { patch.kidView = c.kid; patch.parView = c.par; }
  if (id !== 'trust') patch.grown = false;
  if (id === 'scam' && state.age < 16) Object.assign(patch, {age:16, viewLevel:DEFAULT_LEVEL(16)});
  if (id !== 'scam' && id !== 'level' && state.age === 16 && state.ch === 'scam') Object.assign(patch, {age:12, viewLevel:DEFAULT_LEVEL(12)});
  set(patch);
}
function creditAllowance(label) {
  const s = state, a = s.allowance.amount, p = portions();
  // 儲蓄份自動存進夢想，不產生配對（配對只給孩子主動存的錢）
  s.goal.saved += p.save; s.need += p.need; s.want += p.want;
  s.tx.unshift({id:++seq, when:'今天', store:'家長零用錢', name:'零用錢入帳', amt:a, cat:'收入', income:true});
  addFeed('save', `${label}零用錢 $${fmt(a)}（儲蓄 $${p.save}・需要 $${p.need}・想要 $${p.want}）`);
  toast('kid', `零用錢 $${fmt(a)} 入帳：儲蓄 $${p.save}・需要 $${p.need}・想要 $${p.want}`);
  toast('par', `已撥款 $${a} 給小安`);
  checkGoal(); render();
}
function addApproval(type, title, amt, reason, who = 'kid', extra = {}) {
  state.approvals.unshift({id:++seq, type, title, amt, reason, who, status:'pending', ...extra});
  toast('par', `小安送出一筆需要你同意的請求`);
}
// 套用一個家長設定；初次設定以外，重要的設定會同步通知小安
function applyField(k, v) {
  const s = state, f = FIELDS[k];
  f.set(v); s.limitEdit = null;
  if (s.setup) { render(); return; }
  addFeed('security', `媽媽把${f.name}改為 ${fieldLabel(f, v)}`);
  if (f.tell || k === 'allowance') toast('kid', `媽媽調整了${f.name}：${fieldLabel(f, v)}`);
  else toast('par', `${f.name}已改為 ${fieldLabel(f, v)}`);
}
// 回傳這筆超過了哪些家長設定的上限（空陣列＝沒超過）
function overLimits(m) {
  const s = state, out = [];
  if (m.amt > s.threshold) out.push(`超過單筆上限 $${fmt(s.threshold)}`);
  if (s.monthSpent + m.amt > s.monthBudget) out.push(`會超過每月上限 $${fmt(s.monthBudget)}（這個月已花 $${fmt(s.monthSpent)}）`);
  return out;
}
function doPay(m) {
  const s = state;
  take(m.amt, m.jar || 'want'); s.monthSpent += m.amt;
  const t = {id:++seq, when:'今天', store:m.store, name:m.name, amt:m.amt, cat:m.cat, tag:null, src:m.items ? 'carrier' : 'card', items:m.items};
  s.tx.unshift(t); s.pay = {...s.pay, step:'tag', txId:t.id};
  addFeed('spend', '', {store:m.store, amt:m.amt, items:m.items, tag:null, txId:t.id});
}

const ACT = {
  goCh,
  prevCh() { const i = CH.findIndex(c => c.id === state.ch); if (i > 0) goCh(CH[i - 1].id); },
  nextCh() { const i = CH.findIndex(c => c.id === state.ch); if (i < CH.length - 1) goCh(CH[i + 1].id); },
  reset() { Object.values(timers).forEach(clearTimeout); state = initState(); render(); },
  kv(v) { set({kidView:v, pay:null, lesson:null, quizPick:null, scamQuiz:null, openTx:null}); },
  pv(v) { set({parView:v, limitEdit:null}); },

  // 零用錢與紅包
  autoAllowance() { if (state.allowance.on && !state.allowance.paused) creditAllowance('自動撥款：'); },
  payNow() { creditAllowance('提前撥款：'); },
  tAllowance() { const a = state.allowance; a.on = !a.on; a.paused = false; toast('kid', a.on ? '媽媽開啟了固定零用錢' : '媽媽調整了零用錢設定'); },
  setAllow(v) { state.allowance.amount = Number(v); render(); },
  setDay(v) { state.allowance.day = v; render(); },
  setTime(v) { state.allowance.time = v; render(); },
  pauseAllow(p) { Object.assign(state.allowance, {paused:true, pauseFor:p}); toast('par', `零用錢暫停（${p}）`); },
  resumeAllow() { Object.assign(state.allowance, {paused:false, pauseFor:''}); toast('par', '零用錢已恢復'); },
  grandma() {
    const s = state; s.want += 2000;   // 紅包先進想要罐，再問要不要存一部分到夢想
    s.tx.unshift({id:++seq, when:'今天', store:'外婆', name:'紅包', amt:2000, cat:'收入', income:true});
    s.bigIn = {amt:2000, from:'外婆'}; s.kidView = 'home';
    addFeed('save', '外婆轉入紅包 $2,000（家人名單，直接入帳）');
    toast('par', '外婆轉入 $2,000 給小安（家人名單）');
  },
  bigSave(v) { const s = state, a = Number(v); take(a, 'want'); s.goal.saved += a; const mom = matchFor(a, 'gift'); s.match.heldThisWeek += mom; s.bigIn = null;
    addFeed('save', `小安把紅包 $${a} 存進${s.goal.name}`); toast('kid', `存進${s.goal.name} $${a}${mom ? `，媽媽陪你存 $${mom}` : ''}`); checkGoal(); render(); },
  bigSkip() { set({bigIn:null}); },

  // 付款
  openPay() { set({kidView:'pay', pay:{step:'code', m:null}}); },
  scan(id) {
    const s = state, m = MERCHANTS.find(x => x.id === id);
    s.kidView = 'pay'; s.scene = null;
    if (s.payLocked) { s.pay = {step:'code', m:null}; toast('kid', '付款碼鎖住中，等媽媽確認後才能付款'); return; }
    const blocked = m.cat === '遊戲儲值' && s.blocked.game;
    if (blocked) { s.pay = {step:'blocked', m, why:'cat'}; addFeed('security', `小安嘗試在遊戲平台付款 $${m.amt}，已依封鎖設定攔下`); render(); return; }
    // 錢不夠就不用問爸媽了：先檢查罐子
    if (m.amt > bal()) { s.pay = {step:'code', m:null}; toast('kid', `需要罐和想要罐加起來只有 $${fmt(bal())}，不夠付 $${fmt(m.amt)} 喔`); return; }
    // 同一筆已經在等爸媽回覆，不重複送出
    if (s.approvals.some(a => a.status === 'pending' && a.type === 'big' && a.m && a.m.id === m.id)) {
      s.pay = {step:'code', m:null}; toast('kid', '這筆已經送給爸媽了，等爸媽回覆'); return;
    }
    // 超過單筆上限或每月上限：先不付款，通知家長並等家長同意
    const why = overLimits(m);
    if (why.length) { s.pay = {step:'approval', m, reason:null, why}; render(); return; }
    // 「買下去／存起來」只在花想要罐、金額 ≥ $50 時跳出
    const remind = s.remindToday < MAX_REMIND && m.jar === 'want' && m.amt >= 50 && m.amt <= s.want && !s.goalReady;
    s.pay = {step:remind ? 'choice' : m.amt > s[m.jar] ? 'borrow' : 'confirm', m};
    if (remind) s.remindToday++;
    render();
  },
  payReason(i) { state.pay.reason = Number(i); render(); },
  payBuy() { doPay(state.pay.m); render(); },
  payBorrow() { const m = state.pay.m; toast('kid', `用${JAR_INFO[m.jar === 'want' ? 'need' : 'want'].t}罐補了 $${fmt(m.amt - state[m.jar])}`); doPay(m); render(); },
  paySave() {
    const s = state, m = s.pay.m, mom = matchFor(m.amt, 'saveAtPay');
    take(m.amt, m.jar); s.goal.saved += m.amt; s.match.heldThisWeek += mom; s.saveCount++;
    s.pay = null; s.kidView = 'home';
    addFeed('save', `小安選了「存起來」：$${m.amt} 存進${s.goal.name}${mom ? `，配對保留 $${mom}` : ''}`);
    toast('kid', `存進${s.goal.name} $${m.amt}${mom ? `，媽媽陪你存 $${mom}` : ''}`);
    checkGoal(); render();
  },
  tagPay(tag) {
    const s = state, t = s.tx.find(x => x.id === s.pay.txId); t.tag = tag;
    const f = s.feed.find(x => x.txId === t.id); if (f) f.tag = tag;
    s.pay = {...s.pay, step:'done'}; render();
  },

  // 錢包
  walletTab(t) { set({walletTab:t, jarDraft:null}); },
  openTx(id) { set({openTx:state.openTx === Number(id) ? null : Number(id)}); },
  retag(arg) { const [id, tag] = arg.split('|'); const t = state.tx.find(x => x.id === Number(id)); t.tag = tag; render(); },
  manualAdd() {
    const s = state; take(Math.min(70, bal()), 'want');
    const t = {id:++seq, when:'今天', store:'夜市', name:'雞排', amt:70, cat:'飲食', tag:null, src:'manual'};
    s.tx.unshift(t); s.openTx = t.id;
    addFeed('spend', '', {store:'夜市', amt:70, items:null, tag:null});
    toast('kid', '已手動補記：夜市雞排 $70，記得標記需要或想要');
  },
  review(id) { state.reviewPick = Number(id); const t = state.tx.find(x => x.id === Number(id)); addFeed('review', `小安的每週回顧：最值得的一筆是「${t.name}」`); toast('par', '小安完成每週回顧'); },
  // 三罐子比例（草稿 jarDraft，按儲存或開始使用才生效）
  jarStep(arg) {
    const [i, d] = arg.split('|').map(Number), dr = (state.jarDraft || state.jars).slice();
    dr[i] = Math.max(0, Math.min(100, dr[i] + d)); set({jarDraft:dr});
  },
  jarPreset(i) { set({jarDraft:JAR_PRESETS[Number(i)].slice()}); },
  saveJars() {
    const dr = state.jarDraft; if (!dr || dr[0] + dr[1] + dr[2] !== 100) return;
    state.jars = dr.slice(); state.jarDraft = null; state.jarSheet = false;
    addFeed('save', `小安調整三罐子比例：儲蓄 ${dr[0]}%・需要 ${dr[1]}%・想要 ${dr[2]}%`);
    toast('kid', '三罐子比例已更新，下次零用錢入帳時套用');
  },

  // 初次設定
  parSetupDone() { set({setup:'kid', jarDraft:null, limitEdit:null}); toast('kid', `媽媽設定好了！每週 $${fmt(state.allowance.amount)}，換你分配罐子`); },

  limitSave() {
    const e = state.limitEdit; if (!e) return;
    const f = FIELDS[e.key], raw = String(e.val || '').trim();
    let v;
    if (f.kind === 'time') {
      const mt = raw.match(/^(\d{1,2}):(\d{2})$/);
      if (!mt || +mt[1] > 23 || +mt[2] > 59) { e.err = '請輸入正確的時間，例如 07:30'; render(); return; }
      v = `${mt[1].padStart(2, '0')}:${mt[2]}`;
    } else {
      const n = Number(raw);
      v = f.kind === 'ratio' ? Math.round(n * 10) / 10 : Math.round(n);
      if (!raw || !Number.isFinite(n) || v < f.lo || v > f.hi) { e.err = `請輸入 ${fieldLabel(f, f.lo)}～${fieldLabel(f, f.hi)} 之間的${f.kind === 'ratio' ? '比例' : '金額'}`; render(); return; }
    }
    applyField(e.key, v);
  },

  },

  // 示範選單
  demoMenu(side) { set({demoMenu:state.demoMenu === side ? null : side}); },
  demo(arg) {
    const s = state, [act, a] = arg.split('|');
    s.demoMenu = null;
    // 會產生家長警示或請求的情境：家長端切到總覽，讓「需要你處理」看得到
    if (['simHeld', 'simMule', 'simFakeBuyer', 'simCardFraud', 'expire', 'scan'].includes(act)) s.parView = 'overview';
    if (['simHeld', 'simMule', 'simFakeBuyer', 'grandma', 'autoAllowance'].includes(act)) { s.pay = null; s.kidView = 'home'; }
    ACT[act](a);
    render();
  },
  cardRestore() { state.cardFrozen = false; addFeed('security', '小安的新卡已開卡，恢復使用'); toast('kid', '新卡開好了，可以照常刷卡'); toast('par', '已恢復小安的卡片'); },

  // 長期
  trustDetail() { toast('par', '（示範）信託明細：每月投入紀錄與給付條件'); },
  grow() {
    set({grown:true, parView:'overview', pay:null, susp:null, jarSheet:false,
         dawho:{step:0, id:[false, false, false], fund:'keep', agree:[false, false], share:true}});
    toast('par', '小安 18 歲生日快樂！MMA Kids 即將升級為 DAWHO');
  },
  ungrow() { set({grown:false, kidView:'home', pay:null}); },
  dawhoStep(n) {
    const s = state, st = Number(n), prev = s.dawho.step; s.dawho.step = st;
    if (st === 1 && prev === 0) { addFeed('goal', '小安開始線上申請 DAWHO'); toast('par', '小安開始申請 DAWHO'); }
    if (st === 6) { addFeed('goal', '小安的 DAWHO 開戶完成，信託 $50,000 已撥入'); toast('kid', '審核通過！DAWHO 帳戶開好了'); toast('par', `小安的 DAWHO 開好了，信託 $${fmt(50000)} 已撥入`); }
    render();
  },
  dawhoId(i) { state.dawho.id[Number(i)] = true; toast('kid', ['身分證已上傳', '第二證件已上傳', '自拍比對成功'][Number(i)]); },
  dawhoFund(k) { state.dawho.fund = k; render(); },
  dawhoShare() { state.dawho.share = !state.dawho.share; render(); },
  dawhoAgree(i) { const a = state.dawho.agree; a[Number(i)] = !a[Number(i)]; render(); },
  dawhoSubmit() { state.dawho.step = 5; addFeed('goal', '小安送出 DAWHO 開戶申請，審核中'); toast('kid', '簡訊驗證成功，申請已送出'); toast('par', '小安已送出 DAWHO 申請，審核中'); },
  cheer() { toast('kid', '媽媽：生日快樂！以後要自己好好管錢喔，有問題隨時問我'); toast('par', '祝福已傳給小安'); },
  applyDawho() { toast('kid', '（示範）開啟 DAWHO App'); }
};

// ================= 示範選單（非產品畫面，取代原本的示範控制台） =================
// 每項：[動作|參數, 標籤, 是否可用]
function demoItems(side) {
  const s = state, pending = s.approvals.some(a => a.status === 'pending');
  if (side === 'kid') return s.grown ? [['ungrow', '回到 12 歲']] : [
    ['hd', '零用錢與紅包'],
    ['autoAllowance', `零用錢入帳（每${s.allowance.day} ${s.allowance.time}）`, s.allowance.on && !s.allowance.paused],
    ['grandma', '外婆轉入紅包 $2,000'],
    ['hd', '付款'],
    ['scan|shoe', '店員掃碼：跑步鞋 $1,200'],
    ['hd', '防詐情境（真實流程，會通知媽媽）'],
    ['simHeld', '① 陌生帳戶轉入 $5,000', !s.heldIncoming],
    ['simMule', '② 網友要小安把錢轉出（先按 ①）', !!s.heldIncoming],
    ['simFakeBuyer', '假買家要求補轉 $300'],
    ['simCardFraud', `卡號被盜刷 $${fmt(FRAUD_TX.amt)}`, !s.alerts.some(a => a.kind === 'card')],
    ['hd', '夢想基金'],
    ['ffGoal', '快轉：存到只差一點'],
    ['sunday', '跳到週日 20:00 結算'],
    ['hd', '年齡（查看程度會跟著變）'],
    ...[12, 14, 16].map(a => [`setAge|${a}`, `${a} 歲${s.age === a ? '（目前）' : ''}`, s.age !== a]),
    ['grow', '跳到 18 歲：升級 DAWHO']];
  return [
    ['hd', '防詐情境（真實流程）'],
    ['simHeld', '① 陌生帳戶轉入 $5,000', !s.heldIncoming && !s.grown],
    ['simMule', '② 網友要小安把錢轉出（先按 ①）', !!s.heldIncoming && !s.grown],
    ['simFakeBuyer', '假買家要求補轉 $300', !s.grown],
    ['simCardFraud', `卡號被盜刷：${FRAUD_TX.store} $${fmt(FRAUD_TX.amt)}`, !s.grown && !s.alerts.some(a => a.kind === 'card')],
    ['hd', '同意請求'],
    ['expire', '模擬 24 小時未回覆', pending],
    ['hd', '重來'],
    ['restart', '重新設定（回到初次設定）']];
}
function demoBtn(side) {
  if (state.setup) return '';
  return `<button class="minibtn ${state.demoMenu === side ? 'on' : ''}" data-act="demoMenu" data-arg="${side}" aria-expanded="${state.demoMenu === side}">示範 ▾</button>`;
}
function demoMenu(side) {
  if (state.demoMenu !== side) return '';
  return `<div class="demomenu" role="menu"><div class="dm-t">示範操作・非產品畫面</div>
    ${demoItems(side).map(([a, l, on = true]) => a === 'hd' ? `<div class="dm-h">${l}</div>`
      : `<button class="dm-i" role="menuitem" data-act="demo" data-arg="${a}" ${on ? '' : 'disabled'}>${ic('play', 'width:11px;height:11px')}${l}</button>`).join('')}</div>`;
}

// ================= 渲染與事件 =================
const app = document.getElementById('app');
function render() {
  const scrolls = {};
  app.querySelectorAll('[data-sk]').forEach(el => { scrolls[el.dataset.sk] = el.scrollTop; });
  const d = derive();
  app.innerHTML = `<div class="phonecol"><div class="lbl-row"><span class="lbl-phone">孩子端・小安的手機（${state.grown ? 18 : state.age} 歲）</span>${demoBtn('kid')}</div>${demoMenu('kid')}${viewKid(d)}</div>
    <div class="phonecol"><div class="lbl-row"><span class="lbl-phone">家長端・媽媽的手機</span>${demoBtn('par')}</div>${demoMenu('par')}${viewParent(d)}</div>`;
  app.querySelectorAll('[data-sk]').forEach(el => { if (scrolls[el.dataset.sk]) el.scrollTop = scrolls[el.dataset.sk]; });
}
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  // 示範選單開著時，點選單以外的地方就關掉
  if (state.demoMenu && !e.target.closest('.demomenu') && !(el && el.dataset.act === 'demoMenu')) { state.demoMenu = null; if (!el) { render(); return; } }
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset.arg);
});
app.addEventListener('input', e => {
  if (e.target.id === 'check-input' && state.check) state.check.text = e.target.value;
  if (e.target.id === 'limit-input' && state.limitEdit) state.limitEdit.val = e.target.value;   // 不重繪，保留游標
});
app.addEventListener('keydown', e => { if (e.target.id === 'limit-input' && e.key === 'Enter') ACT.limitSave(); });
function fit() {
  const W = app.offsetWidth, H = app.offsetHeight, sc = Math.min(innerWidth / W, innerHeight / H);
  app.style.transform = `translate(${(innerWidth - W * sc) / 2}px, ${(innerHeight - H * sc) / 2}px) scale(${sc})`;
}
addEventListener('resize', fit);
render();
fit();

</script>
</body>
</html>
